[project]
name = "delivery_service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.12.0",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "strict"
markers = [
    "service: tests for service-layer business logic",
    "repository: tests for repository/storage behavior",
    "routes: tests for FastAPI route behavior",
    "unit: fast isolated tests",
    "integration: tests involving multiple layers or external systems",
    "kafka: tests involving Kafka producer/consumer behavior",
]

[tool.uv]
default-groups = ["dev", "tooling"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[kafka]>=4.15.0",
    "respx>=0.23.1",
    "httpx2>=2.12.0",
]

tooling = [
    "alembic>=1.19.1",
    "python-dotenv>=1.2.3",
    "tqdm>=4.70.0",
]
