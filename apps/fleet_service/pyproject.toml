[project]
name = "fleet_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "strict"
markers = [
    "service: tests for service-layer business logic",
    "repository: tests for repository/storage behavior",
    "routes: tests for FastAPI route behavior",
    "unit: fast isolated tests",
    "integration: tests involving multiple layers or external systems",
    "kafka: tests involving Kafka producer/consumer behavior",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "testcontainers[kafka]>=4.15.0",
]
