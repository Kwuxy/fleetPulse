[project]
name = "gps_simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "strict"
markers = [
    "service: tests for service-layer business logic",
    "repository: tests for repository/storage behavior",
    "unit: fast isolated tests",
    "integration: tests involving multiple layers or external systems",
    "kafka: tests involving Kafka producer/consumer behavior",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
