name: Tests
on: push
jobs:
  tests:
    strategy:
      matrix:
        service: ["fleet_service", "delivery_service", "gps_simulator"]
      fail-fast: false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run pytest test -q --cov-report=term --cov-report=xml