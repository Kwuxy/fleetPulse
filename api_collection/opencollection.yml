opencollection: 1.0.0

info:
  name: Fleet Pulse Collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: before-request
      code: |-
        const moment = require("moment");

        function generate_date(days) {
          return moment().add(days, 'days').format("YYYY-MM-DD");
        }

        function generate_license_plate() {
          function generate_letter() {
            return String.fromCharCode(Math.floor(Math.random() * 26) + 65);
          }
          
          function generate_number() {
            return Math.floor(Math.random() * 10);
          }
          
          return `${generate_letter()}${generate_letter()}-${generate_number()}${generate_number()}${generate_number()}-${generate_letter()}${generate_letter()}`;
        }

        bru.setVar("tomorrow", generate_date(1));
        bru.setVar("license_plate", generate_license_plate());
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
    presets:
      request:
        type: http
        url: 127.0.0.1:8000
